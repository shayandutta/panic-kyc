syntax = "proto3";

package bulk;

option go_package = "kyc-platform/shared/proto/bulk;bulkpb";

service BulkService {
  rpc CreateJob(CreateJobRequest) returns (Job);
  rpc GetJob(GetJobRequest) returns (Job);
}

message BulkItem {
  string pan = 1;
  string name = 2;
  string reference_id = 3;
}

message CreateJobRequest {
  string client_id = 1;
  repeated BulkItem items = 2;
}

message GetJobRequest {
  string client_id = 1;
  string id = 2;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_COMPLETED = 3;
}

message Job {
  string id = 1;
  string client_id = 2;
  JobStatus status = 3;
  int32 total = 4;
  int32 processed = 5;
  int32 valid = 6;
  int32 invalid = 7;
  int32 failed = 8;
  string created_at = 9;
}
