# Infrastructure only:   docker compose up -d
# Whole platform:        docker compose --profile apps up -d --build

x-app: &app
  profiles: ["apps"]
  restart: on-failure # services exit if a dependency isn't up yet; retry

services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432" # 5433 on the host, in case a local postgres already uses 5432
    environment:
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kyc
      POSTGRES_DB: verification
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d verification"]
      interval: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # Containers reach the broker as kafka:9092, the host as localhost:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 30

  # ---------------- application services ----------------

  sandbox:
    <<: *app
    build: { context: ., args: { SERVICE_PATH: services/sandbox } }
    ports: ["8090:8090"]

  verification-service:
    <<: *app
    build: { context: ., args: { SERVICE_PATH: services/verification-service/cmd } }
    environment:
      POSTGRES_URL: postgres://kyc:kyc@postgres:5432/verification?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      PII_SECRET: dev-only-pii-secret-change-me
      SOURCE_A_URL: http://sandbox:8090/sources/source-a/pan
      SOURCE_B_URL: http://sandbox:8090/sources/source-b/pan
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_started }

  bulk-service:
    <<: *app
    build: { context: ., args: { SERVICE_PATH: services/bulk-service/cmd } }
    environment:
      MONGODB_URI: mongodb://mongo:27017
      VERIFICATION_SERVICE_ADDR: verification-service:9093
    depends_on: [mongo, verification-service]

  webhook-service:
    <<: *app
    build: { context: ., args: { SERVICE_PATH: services/webhook-service/cmd } }
    environment:
      KAFKA_BROKERS: kafka:9092
      WEBHOOKS_FILE: deploy/docker/webhooks.json
    depends_on:
      kafka: { condition: service_healthy }

  api-gateway:
    <<: *app
    build: { context: ., args: { SERVICE_PATH: services/api-gateway/cmd } }
    ports: ["8080:8080"]
    environment:
      REDIS_ADDR: redis:6379
      VERIFICATION_SERVICE_ADDR: verification-service:9093
      BULK_SERVICE_ADDR: bulk-service:9095
    depends_on: [redis, verification-service, bulk-service]

volumes:
  mongo-data:
  postgres-data:
