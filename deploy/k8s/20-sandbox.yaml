# Fake outside world: upstream providers and a client webhook receiver
apiVersion: apps/v1
kind: Deployment
metadata: { name: sandbox }
spec:
  replicas: 1
  selector: { matchLabels: { app: sandbox } }
  template:
    metadata: { labels: { app: sandbox } }
    spec:
      terminationGracePeriodSeconds: 30 # time for graceful shutdown after SIGTERM
      containers:
        - name: sandbox
          image: kyc/sandbox
          envFrom:
            - configMapRef: { name: kyc-config }
          ports: [{ containerPort: 8090 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe: { httpGet: { path: /health, port: 8090 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8090 }, periodSeconds: 10, failureThreshold: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: sandbox }
spec:
  selector: { app: sandbox }
  ports: [{ port: 8090 }]
