# Two replicas: the outbox relay uses SKIP LOCKED, so both can relay safely.
apiVersion: apps/v1
kind: Deployment
metadata: { name: verification-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: verification-service } }
  template:
    metadata: { labels: { app: verification-service } }
    spec:
      terminationGracePeriodSeconds: 30 # time for graceful shutdown after SIGTERM
      containers:
        - name: verification-service
          image: kyc/verification-service
          envFrom:
            - configMapRef: { name: kyc-config }
            - secretRef: { name: kyc-secrets }
          ports: [{ containerPort: 9093 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe: { tcpSocket: { port: 9093 }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 9093 }, periodSeconds: 10, failureThreshold: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: verification-service }
spec:
  selector: { app: verification-service }
  ports: [{ port: 9093 }]
